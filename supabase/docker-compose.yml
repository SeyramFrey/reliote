services:
  db:
    image: supabase/postgres:15.8.1.060
    container_name: reliote-db
    restart: unless-stopped
    ports:
      # Lié à 127.0.0.1 : Docker contourne UFW, un port publié sur 0.0.0.0
      # serait joignable depuis Internet. BIND_ADDR ne s'ouvre qu'en connaissance de cause.
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-54322}:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      - reliote-db-data:/var/lib/postgresql/data
      - ./init/98-realtime.sql:/docker-entrypoint-initdb.d/98-realtime.sql:ro
      - ./init/99-reliote-perms.sql:/docker-entrypoint-initdb.d/99-reliote-perms.sql:ro
      - ./init/99z-role-passwords.sh:/docker-entrypoint-initdb.d/99z-role-passwords.sh:ro
      # Reliote schema + seed mounted but NOT auto-applied — applied via apply-migrations.sh
      # after GoTrue has run its own auth-schema migrations.
      - ./migrations:/reliote/migrations:ro
      - ./seed.sql:/reliote/seed.sql:ro
      - ./seed.admin.sql:/reliote/seed.admin.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    image: supabase/gotrue:v2.177.0
    container_name: reliote-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:54321}
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      # Liste blanche des redirections après e-mail (confirmation, reset). Jamais
      # « * » : n'importe quel site pourrait recevoir le jeton de session.
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST:-http://localhost:3000/**,http://localhost:3001/**}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: ${GOTRUE_PASSWORD_MIN_LENGTH:-8}
      # Dev : comptes confirmés sans e-mail. Prod : "false" + SMTP ci-dessous (docs/VPS-DEPLOYMENT.md §3.5).
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-true}
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT:-465}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL:-admin@reliote.test}
      GOTRUE_SMTP_SENDER_NAME: ${GOTRUE_SMTP_SENDER_NAME:-Reliote}
      # Freins anti-abus (par heure) : e-mails envoyés, OTP/liens magiques.
      GOTRUE_RATE_LIMIT_EMAIL_SENT: ${GOTRUE_RATE_LIMIT_EMAIL_SENT:-30}
      GOTRUE_RATE_LIMIT_VERIFY: ${GOTRUE_RATE_LIMIT_VERIFY:-30}
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: ${GOTRUE_RATE_LIMIT_TOKEN_REFRESH:-150}
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"

  rest:
    image: postgrest/postgrest:v12.2.0
    container_name: reliote-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}

  kong:
    image: kong:2.8.1
    container_name: reliote-kong
    restart: unless-stopped
    depends_on:
      - auth
      - rest
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${KONG_HTTP_PORT:-54321}:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      - ./kong.yml:/var/lib/kong/kong.yml:ro

  studio:
    image: supabase/studio:2026.06.01-sha-a4334a2
    container_name: reliote-studio
    restart: unless-stopped
    depends_on:
      - kong
    ports:
      # Studio n'a pas d'authentification : jamais publié hors de 127.0.0.1
      # (en prod, derrière la basic auth de Caddy — docs/VPS-DEPLOYMENT.md §3.1).
      - "127.0.0.1:${STUDIO_PORT:-54323}:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: Reliote
      DEFAULT_PROJECT_NAME: reliote
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: http://localhost:${KONG_HTTP_PORT:-54321}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      LOGFLARE_LOGGER_BACKEND_API_KEY: ""
      LOGFLARE_API_KEY: ""
      AUTH_JWT_SECRET: ${JWT_SECRET}

  meta:
    image: supabase/postgres-meta:v0.84.2
    container_name: reliote-meta
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  # Supabase Storage API — file backend (no S3 needed for dev).
  # Buckets + policies are created by migration 0006 after `apply-migrations.sh`.
  storage:
    image: supabase/storage-api:v1.11.13
    container_name: reliote-storage
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: "52428800"            # 50 MB hard ceiling (per-bucket caps are smaller)
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
    volumes:
      - reliote-storage-data:/var/lib/storage

  # On-the-fly image transformations (resize/crop) for Storage requests with ?width=…&height=…
  realtime:
    # Supabase Realtime (messagerie). Le nom d'hôte sert d'identifiant de
    # tenant : « realtime-dev » est le tenant créé par SEED_SELF_HOST, d'où ce
    # container_name imposé (Kong l'appelle par ce nom).
    image: supabase/realtime:v2.34.47
    container_name: realtime-dev.supabase-realtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:-supabaserealtime}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"

  imgproxy:
    image: darthsim/imgproxy:v3.21.0
    container_name: reliote-imgproxy
    restart: unless-stopped
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
    volumes:
      - reliote-storage-data:/var/lib/storage

volumes:
  reliote-db-data:
  reliote-storage-data:
